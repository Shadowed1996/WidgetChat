<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>il pollaio — chat di slayer_beard</title>

<link rel="icon" href="img/favicon.png">

<link rel="stylesheet" href="css/font.css">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/pollaio.css">

<link rel="stylesheet" href="css/menu.css">
</head>
<body>

<div class="pollaio" data-tema="notte" data-verso="su">

  <div class="pollaio__spia" data-stato="collego">
    <span class="pollaio__spia-punto"></span>
    <span class="pollaio__spia-testo">Apro il pollaio…</span>
  </div>

  <div class="pollaio__gente" hidden>
    <button class="pollaio__gente-bottone" type="button"
            aria-expanded="false" aria-controls="elenco-gente">
      <span class="pollaio__gente-conta">—</span>
    </button>
  </div>

  <div class="pollaio__lista" id="elenco-gente" hidden>
    <p class="pollaio__lista-eco" role="status"></p>
    <div class="pollaio__lista-scomparti"></div>
  </div>

  <div class="pollaio__treno" data-fase="niente" hidden>
    <p class="pollaio__treno-testa">
      <span class="pollaio__treno-titolo">Hype Train</span>
      <span class="pollaio__treno-livello">Livello 1</span>
    </p>
    <span class="pollaio__treno-barra">
      <span class="pollaio__treno-riempimento"></span>
    </span>
    <p class="pollaio__treno-piede">
      <span class="pollaio__treno-punti"></span>
      <span class="pollaio__treno-tempo"></span>
    </p>
  </div>

  <ol class="pollaio__elenco"></ol>

  <div class="pollaio__pollo" hidden>
    <img class="pollaio__pollo-img" data-src="img/mascot.png" alt="" aria-hidden="true">
  </div>

  <div class="pollaio__barra" hidden>

    <div class="pollaio__filtri" role="group" aria-label="Cosa faccio vedere">
      <button class="pollaio__filtro is-scelto" type="button" data-filtro="tutto" aria-pressed="true">Tutto</button>
      <button class="pollaio__filtro" type="button" data-filtro="twitch" aria-pressed="false" hidden>Twitch</button>
      <button class="pollaio__filtro" type="button" data-filtro="kick" aria-pressed="false" hidden>Kick</button>
      <button class="pollaio__filtro" type="button" data-filtro="youtube" aria-pressed="false" hidden>YouTube</button>
      <button class="pollaio__filtro" type="button" data-filtro="eventi" aria-pressed="false">Eventi</button>

      <button class="pollaio__sondaggio-apri" type="button" data-modo="poll" aria-expanded="false"
              aria-controls="modulo-sondaggio" hidden>Sondaggio</button>

      <button class="pollaio__sondaggio-apri" type="button" data-modo="prediction" aria-expanded="false"
              aria-controls="modulo-sondaggio" hidden>Pronostico</button>

      <button class="pollaio__pausa" type="button" aria-pressed="false" title="Ferma la chat: quello che c’è resta lì">
        <span class="pollaio__pausa-segno" aria-hidden="true"></span>
        <span class="pollaio__pausa-testo">Ferma</span>
      </button>
    </div>

    <form class="pollaio__sondaggio" id="modulo-sondaggio" hidden>
      <input class="pollaio__sondaggio-campo pollaio__sondaggio-domanda" type="text"
             maxlength="60" placeholder="La domanda" aria-label="La domanda del sondaggio"
             autocomplete="off">

      <div class="pollaio__sondaggio-scelte"></div>

      <div class="pollaio__sondaggio-piede">
        <button class="pollaio__sondaggio-piu" type="button">Aggiungi scelta</button>

        <label class="pollaio__sondaggio-durata">
          <span>secondi</span>
          <input class="pollaio__sondaggio-campo" type="number" min="15" max="1800" step="15"
                 value="120" inputmode="numeric" aria-label="Quanto dura il sondaggio">
        </label>

        <button class="pollaio__sondaggio-crea" type="submit">Apri il sondaggio</button>
      </div>
    </form>

    <button class="pollaio__attesa" type="button" hidden></button>

    <form class="pollaio__scrivi" hidden>
      <span class="pollaio__scrivi-conca">
        <ul class="pollaio__suggeriti" role="listbox" aria-label="Emote che somigliano" hidden></ul>
        <textarea class="pollaio__scrivi-campo" rows="1" maxlength="500"
                  placeholder="Scrivi in chat" aria-label="Scrivi in chat"
                  autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
        <span class="pollaio__scrivi-resta" aria-hidden="true" hidden></span>
      </span>
      <button class="pollaio__scrivi-manda" type="submit" disabled>Invia</button>
    </form>

    <p class="pollaio__invito" hidden>
      <button class="pollaio__invito-btn" type="button">Connetti account</button>
    </p>

    <p class="pollaio__eco" role="status"></p>
  </div>

</div>

<script src="js/impostazioni.js"></script>
<script src="js/irc.js"></script>
<script src="js/kick.js"></script>
<script src="js/youtube.js"></script>
<script src="js/emote.js"></script>
<script src="js/badge.js"></script>
<script src="js/rilievo.js"></script>
<script src="js/eventi.js"></script>
<script src="js/treno.js"></script>
<script src="js/resa.js"></script>
<script src="js/conto.js"></script>
<script src="js/comandi.js"></script>
<script src="js/gente.js"></script>
<script src="js/azioni.js"></script>
<script src="js/barra.js"></script>
<script src="js/prova.js"></script>
<script src="js/menu.js"></script>
<script src="js/pollaio.js"></script>

</body>
</html>
